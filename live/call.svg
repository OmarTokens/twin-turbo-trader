<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 138" width="880" height="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>.bg{fill:#fcfcfb;stroke:#e4e3df}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7974}.chip{fill:#f3f2ef}
.grid{stroke:#ecebe7}.zero{stroke:#c9c8c3}.div{stroke:#e4e3df}.ax{fill:#7a7974;font-size:12px}
.tt{fill:#2a78d6}.tts{stroke:#2a78d6}.vc{fill:#1baf7a}.vcs{stroke:#1baf7a}.q{stroke:#8a63d2}.qf{fill:#8a63d2}.sp{stroke:#eb6834}.spf{fill:#eb6834}
.up{fill:#5b9be6}.upv{fill:#5cc49a}.dn{fill:#eca27a}.fut{fill:#efeeea}.now{stroke:#0b0b0b}
.st-test{fill:#dbe8f9}.st-testt{fill:#1f5fae}.st-wait{fill:#f6ead2}.st-waitt{fill:#8a5a00}.st-dead{fill:#ecebe7}.st-deadt{fill:#6b6a66}.st-ok{fill:#d7f0e4}.st-okt{fill:#127a54}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.4s ease-out .2s forwards}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s ease-out .3s forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.35}}
@media (prefers-reduced-motion: reduce){.draw,.fade,.grow,.pulse{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19;stroke:#2e2e2c}.t1{fill:#fff}.t2{fill:#c3c2b7}.t3{fill:#9a998f}.chip{fill:#242423}
.grid{stroke:#2a2a28}.zero{stroke:#4a4a46}.div{stroke:#2e2e2c}.ax{fill:#9a998f}.fut{fill:#262624}.now{stroke:#fff}
.st-test{fill:#1c2f47}.st-testt{fill:#8dbaf0}.st-wait{fill:#3a2f18}.st-waitt{fill:#e6bd6a}.st-dead{fill:#2c2c2a}.st-deadt{fill:#a5a49c}.st-ok{fill:#16362a}.st-okt{fill:#6fd3a6}}</style><rect x=".5" y=".5" width="879" height="137" rx="14" class="bg"/><text x="28" y="38" class="t2" font-size="13" font-weight="600" letter-spacing="1.2">THE CALL · ONE PREDICTION A WEEK, GRADED NEXT FRIDAY</text><text x="852" y="38" class="t3" font-size="13" text-anchor="end">Calls right: 0 of 0</text><rect x="28.0" y="54" width="404.0" height="68" rx="10" class="chip"/><text x="44.0" y="76" class="t3" font-size="11.5" font-weight="700" letter-spacing="1">LAST WEEK</text><rect x="361.0" y="62" width="55" height="22" rx="11" class="st-dead"/><text x="388.5" y="77" class="st-deadt" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".6">FIRST</text><text x="44.0" y="104" class="t1" font-size="13.5" font-weight="600">First call goes out this week.</text><rect x="448.0" y="54" width="404.0" height="68" rx="10" class="chip"/><text x="464.0" y="76" class="t3" font-size="11.5" font-weight="700" letter-spacing="1">THIS WEEK (WEEK 5)</text><rect x="788.4" y="62" width="48" height="22" rx="11" class="st-test"/><text x="812.1999999999999" y="77" class="st-testt" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".6">OPEN</text><text x="464.0" y="104" class="t1" font-size="13.5" font-weight="600">At least 7 of 8 order instructions fill.</text></svg>