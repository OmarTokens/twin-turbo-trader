.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.4s ease-out .2s forwards}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s ease-out .3s forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes grow{to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.35}}
@media (prefers-reduced-motion: reduce){.draw,.fade,.grow,.pulse{animation:none;stroke-dashoffset:0;opacity:1;transform:none}}
