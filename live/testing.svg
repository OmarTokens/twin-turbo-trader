font-weight="700" text-anchor="middle" letter-spacing=".6">RETIRE?</text><text x="324.0" y="140" class="t1" font-size="16" font-weight="700">Event veto + crowding brake</text><text x="324.0" y="160" class="t2" font-size="12">Logged on every buy, never allowed to</text><text x="324.0" y="176" class="t2" font-size="12">change an order.</text><text x="324.0" y="206" class="t3" font-size="11">Checked</text><text x="324.0" y="223" class="t1" font-size="12.5" font-weight="600">23 buys</text><text x="401.3333333333333" y="206" class="t3" font-size="11">Fired</text><text x="401.3333333333333" y="223" class="t1" font-size="12.5" font-weight="600">0 times</text><text x="478.66666666666663" y="206" class="t3" font-size="11">Cost</text><text x="478.66666666666663" y="223" class="t1" font-size="12.5" font-weight="600">1 search/buy</text><text x="324.0" y="250" class="t3" font-size="11.5">Proposal R8: switch them off.</text><rect x="588.0" y="56" width="264.0" height="206" rx="10" class="chip"/><text x="604.0" y="82" class="t3" font-size="11.5" font-weight="700" letter-spacing="1">LAB EXPERIMENT #2</text><rect x="604.0" y="94" width="122" height="22" rx="11" class="st-wait"/><text x="664.8" y="109" class="st-waitt" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".6">NEEDS APPROVAL</text><text x="604.0" y="140" class="t1" font-size="16" font-weight="700">Sell-off rebound</text><text x="604.0" y="160" class="t2" font-size="12">AI/chip leader 25%+ off its high closes</text><text x="604.0" y="176" class="t2" font-size="12">back above its 10-day.</text><text x="604.0" y="206" class="t3" font-size="11">Size</text><text x="604.0" y="223" class="t1" font-size="12.5" font-weight="600">1 small slot</text><text x="681.3333333333334" y="206" class="t3" font-size="11">Stop</text><text x="681.3333333333334" y="223" class="t1" font-size="12.5" font-weight="600">−8%</text><text x="758.6666666666666" y="206" class="t3" font-size="11">Exit</text><text x="758.6666666666666" y="223" class="t1" font-size="12.5" font-weight="600">50-day/15d</text><text x="604.0" y="250" class="t3" font-size="11.5">Starts the Monday after a yes.</text><text x="28" y="292" class="t2" font-size="12" font-weight="600" letter-spacing="1">RULE LAB · IDEAS THE AGENT PROPOSED ITSELF, BACK-TESTED ON 5 YEARS</text><text x="28" y="323" class="t1" font-size="12.5" font-weight="700">R5</text><text x="62" y="323" class="t1" font-size="12.5">Breadth brake: hold 3 names when &lt; 35% of stocks are above their 50-day</text><rect x="742" y="308" width="85" height="22" rx="11" class="st-test"/><text x="784.3" y="323" class="st-testt" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".6">WEAK PASS</text><text x="730" y="323" class="t3" font-size="11.5" text-anchor="end">smaller worst drop, same return</text><text x="28" y="353" class="t1" font-size="12.5" font-weight="700">R6</text><text x="62" y="353" class="t1" font-size="12.5">Skip Boomer top-ups under a small minimum</text><rect x="742" y="338" width="62" height="22" rx="11" class="st-ok"/><text x="773.2" y="353" class="st-okt" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing=".6">PASSES</text><text x="730" y="353" class="t3" font-size="11.5" text-anchor="end">no effect on return, fewer tiny orders</text><line x1="28" x2="852" y1="376" y2="376" class="div"/><text x="28" y="398" class="t3" font-size="11.5" font-weight="700" letter-spacing="1">RULE GRAVEYARD</text><text x="150" y="398" class="t3" font-size="12">R1 faster ranking: −4.7 pts/yr in back-test  ·  R7 wait for a 2nd down day: helped 1 of 5 years</text></svg>